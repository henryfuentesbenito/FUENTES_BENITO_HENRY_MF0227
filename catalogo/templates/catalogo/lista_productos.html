
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de productos</title>
</head>
<body>

    <h1>Listado de productos</h1>

    <a href="{% url 'nuevo_producto' %}">
        Añadir producto
    </a>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio original</th>
                <th>Descuento</th>
                <th>Precio final</th>
            </tr>
        </thead>

        <tbody>
            {% for producto in productos %}
            <tr>
                <td>{{ producto.nombre }}</td>
                <td>{{ producto.precio }} €</td>
                <td>{{ producto.descuento }} %</td>
                <td>{{ producto.precio_final|floatformat:2 }} €</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">
                    No hay productos registrados.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
